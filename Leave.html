<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    
    <title>Presence - Leave Management</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f9f9f9">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            font-family: 'Inter', sans-serif;
        }
        .bento-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .bento-card:active {
            transform: scale(0.98);
        }
        /* Optimized Modal Overlay (Removed backdrop-filter for speed) */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            will-change: opacity;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
        }
        .bottom-sheet.active {
            transform: translateY(0);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #toDateContainer {
            transition: all 0.3s ease-out;
            max-height: 200px;
            opacity: 1;
            transform-origin: top;
            will-change: max-height, opacity, transform;
        }
        #toDateContainer.hidden-field {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            margin-top: 0;
            margin-bottom: 0;
            overflow: hidden;
            transform: scaleY(0);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    
<header class="w-full top-0 sticky z-40 flex items-center justify-between px-margin-mobile h-16 bg-surface border-b border-surface-container">
    <div class="flex items-center gap-stack-md">
        <button class="active:scale-95 transition-transform duration-150">
            <span class="material-symbols-outlined text-primary">menu</span>
        </button>
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tight text-primary">Leave</h1>
    </div>
    <div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
        <img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLeowp8GD9NIF8fs5R2RR13JIMlOFun02QPmWjxDgGnv4VlxLlY2y_m1UELtokWDfEcPbtWWhuAcZ4FDGKOGNGAW-Hzvr7H03zHYZ2R1Uh0p88HvmCdZPLN3DBYHVfMnGVuJrlDbG5MemMf4dOUNmBcPKJnYrmlQRkEIE1t1SlhELIXvUMrOR_sgNdplMmCyAGQ5Q_zk8SbECPyazJVGuQgh4pz9_EGensf5V-VMLPdvimw_u6E_yOryvLeCXWAyT9rCBFSyRIFQ"/>
    </div>
</header>

<main class="flex-1 px-margin-mobile pt-stack-lg pb-48">
    <section class="grid grid-cols-2 gap-stack-md mb-stack-lg">
        <div class="col-span-2 bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_12px_20px_0_rgba(0,0,0,0.04)] border border-surface-container flex flex-col gap-stack-md bento-card">
            <div class="flex justify-between items-center">
                <span class="font-label-md text-label-md text-primary">October 2026</span>
            </div>
            <div class="grid grid-cols-7 gap-1">
                <div class="text-center font-label-sm text-[10px] text-secondary">S</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">M</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">T</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">W</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">T</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">F</div>
                <div class="text-center font-label-sm text-[10px] text-secondary">S</div>
                <div class="h-4 border border-transparent"></div>
                <div class="h-4 border border-transparent"></div>
                <div class="h-4 border border-transparent"></div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">1</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">2</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">3</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">4</div>
                <div class="h-4 border border-outline-variant rounded-sm flex items-center justify-center text-[8px] text-secondary">5</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">6</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">7</div>
                <div class="h-4 bg-primary rounded-sm flex items-center justify-center text-[8px] text-on-primary font-bold">8</div>
            </div>
        </div>
    </section>

    <div class="flex items-center justify-between mb-stack-md">
        <h2 class="font-headline-sm text-headline-sm text-primary">Recent History</h2>
        <button class="font-label-md text-label-md text-secondary hover:text-primary transition-colors">View All</button>
    </div>
    <div class="space-y-stack-md">
        <div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_12px_20px_0_rgba(0,0,0,0.04)] border border-surface-container flex flex-col gap-stack-sm">
            <div class="flex justify-between items-start">
                <div class="flex flex-col">
                    <span class="font-headline-sm text-headline-sm text-primary">Sick Leave</span>
                    <span class="font-body-sm text-body-sm text-secondary">Oct 24 — Oct 25</span>
                </div>
                <span class="px-2 py-1 bg-secondary-container text-on-secondary-container font-label-sm text-label-sm rounded-lg flex items-center gap-1">
                    <span class="material-symbols-outlined text-[14px]">schedule</span> Pending
                </span>
            </div>
            <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1 italic">"Recovering from seasonal flu..."</p>
        </div>
    </div>
</main>

<div class="fixed bottom-0 left-0 w-full z-50 pointer-events-none">
    <div class="px-margin-mobile mb-4 pointer-events-auto">
        <button class="w-full bg-primary text-on-primary h-14 rounded-xl font-headline-sm text-headline-sm shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all duration-150" id="openLeaveForm">
            <span class="material-symbols-outlined">add</span>Apply for Leave
        </button>
    </div>
    <nav class="w-full flex justify-around items-center px-4 py-3 bg-surface border-t border-surface-container shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)] pointer-events-auto">
        <button onclick="window.location.href='Home.html'" class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:bg-surface-container-high transition-colors active:scale-90 duration-200">
            <span class="material-symbols-outlined">fingerprint</span>
            <span class="font-label-md text-label-md">Attendance</span>
        </button>
        <button onclick="window.location.href='Leave.html'" class="flex flex-col items-center justify-center text-primary bg-secondary-container rounded-full px-6 py-2 active:scale-90 transition-all duration-200">
            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">event_busy</span>
            <span class="font-label-md text-label-md">Leave</span>
        </button>
    </nav>
</div>

<div class="modal-overlay fixed inset-0 z-[60]" id="modalOverlay"></div>
<div class="bottom-sheet fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[2rem] z-[70] shadow-2xl p-margin-mobile overflow-y-auto max-h-[90vh] no-scrollbar" id="leaveSheet">
    <div class="w-12 h-1 bg-surface-container-highest rounded-full mx-auto mb-stack-lg"></div>
    <header class="flex justify-between items-center mb-stack-lg">
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Apply Leave</h2>
        <button class="p-2 hover:bg-surface-container rounded-full transition-colors" id="closeLeaveForm">
            <span class="material-symbols-outlined">close</span>
        </button>
    </header>
    <form class="space-y-stack-lg" id="leaveApplicationForm">
        <div class="space-y-1">
            <label class="font-label-sm text-label-sm text-secondary uppercase">Leave Reason</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg p-stack-md font-body-md focus:ring-2 focus:ring-primary">
                <option>Select a reason</option>
                <option>Sick Leave</option>
                <option>Annual Leave</option>
            </select>
        </div>
        <div class="space-y-stack-sm">
            <label class="font-label-sm text-label-sm text-secondary uppercase">Duration</label>
            <div class="grid grid-cols-3 gap-2">
                <button class="duration-toggle active bg-primary text-on-primary border border-primary py-2 rounded-lg font-label-md text-label-md transition-all" data-type="full" type="button">Full Day</button>
                <button class="duration-toggle bg-surface-container-low text-primary border border-transparent py-2 rounded-lg font-label-md text-label-md transition-all" data-type="morning" type="button">10:00 - 2:30</button>
                <button class="duration-toggle bg-surface-container-low text-primary border border-transparent py-2 rounded-lg font-label-md text-label-md transition-all" data-type="evening" type="button">2:30 - 7:00</button>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-stack-md items-start">
            <div class="space-y-1">
                <label class="font-label-sm text-label-sm text-secondary uppercase">From Date</label>
                <input class="w-full bg-surface-container-low border-none rounded-lg p-stack-md font-body-md focus:ring-2 focus:ring-primary" type="date"/>
            </div>
            <div class="space-y-1" id="toDateContainer">
                <label class="font-label-sm text-label-sm text-secondary uppercase">To Date</label>
                <input class="w-full bg-surface-container-low border-none rounded-lg p-stack-md font-body-md focus:ring-2 focus:ring-primary" type="date"/>
            </div>
        </div>
        <div class="space-y-1">
            <label class="font-label-sm text-label-sm text-secondary uppercase">Remark</label>
            <textarea class="w-full bg-surface-container-low border-none rounded-lg p-stack-md font-body-md focus:ring-2 focus:ring-primary" placeholder="Additional details..." rows="3"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-stack-md mb-10">
            <button class="w-full border border-outline-variant text-primary h-14 rounded-xl font-headline-sm text-headline-sm active:scale-95 transition-all duration-150" id="cancelLeaveForm" type="button">Cancel</button>
            <button class="w-full bg-primary text-on-primary h-14 rounded-xl font-headline-sm text-headline-sm shadow-md active:scale-95 transition-all duration-150" type="submit">Save</button>
        </div>
    </form>
</div>

<script>
    const openBtn = document.getElementById('openLeaveForm');
    const closeBtn = document.getElementById('closeLeaveForm');
    const cancelBtn = document.getElementById('cancelLeaveForm');
    const overlay = document.getElementById('modalOverlay');
    const sheet = document.getElementById('leaveSheet');
    const toDateContainer = document.getElementById('toDateContainer');
    const durationToggles = document.querySelectorAll('.duration-toggle');
    const leaveForm = document.getElementById('leaveApplicationForm');

    const toggleModal = (show) => {
        if (show) {
            overlay.classList.add('active');
            sheet.classList.add('active');
            document.body.style.overflow = 'hidden';
        } else {
            overlay.classList.remove('active');
            sheet.classList.remove('active');
            document.body.style.overflow = '';
        }
    };

    openBtn.addEventListener('click', () => toggleModal(true));
    closeBtn.addEventListener('click', () => toggleModal(false));
    overlay.addEventListener('click', () => toggleModal(false));
    cancelBtn.addEventListener('click', () => { toggleModal(false); });

    leaveForm.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Application submitted successfully!');
        toggleModal(false);
    });

    durationToggles.forEach(toggle => {
        toggle.addEventListener('click', () => {
            const type = toggle.getAttribute('data-type');
            durationToggles.forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('bg-surface-container-low', 'text-primary', 'border-transparent');
            });
            toggle.classList.add('active', 'bg-primary', 'text-on-primary', 'border-primary');
            toggle.classList.remove('bg-surface-container-low', 'text-primary', 'border-transparent');
            
            if (type === 'full') {
                toDateContainer.classList.remove('hidden-field');
            } else {
                toDateContainer.classList.add('hidden-field');
            }
        });
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => console.log('ServiceWorker registered'))
                .catch((error) => console.log('ServiceWorker failed: ', error));
        });
    }
</script>
</body>
</html>
