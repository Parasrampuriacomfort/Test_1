<script>
const name = localStorage.getItem("name");

const API_URL2 = "https://script.google.com/macros/s/AKfycbyJ81-WCQupQpdtmUlrgQdtMbcmgBES6ESVof1fXuqdLwZ1Cr3ghZCaKrFh3ig42hdh/exec";

async function loadAttendance() {

const email = localStorage.getItem("email");

const response = await fetch(
    API_URL2 + "?email=" + encodeURIComponent(email)
);
    const data = await response.json();

    const list = document.getElementById("attendanceList");
    list.innerHTML = "";

    // Logged in user's email
    const currentUserEmail = localStorage.getItem("email");

    // Only this user's attendance
    const myAttendance = data.filter(record =>
        record["Employee Email"] === currentUserEmail
    );

    // Latest first
    data.reverse();

    data.forEach(record => {

        list.innerHTML += `
        <div class="flex items-center justify-between p-4 border-b border-surface-container hover:bg-surface-container-low transition-colors">

            <div class="flex items-center gap-3">

                <div class="w-10 h-10 bg-surface-container rounded flex items-center justify-center text-primary">

                    <span class="material-symbols-outlined"
                    style="font-variation-settings:'FILL' 1;">
                        login
                    </span>

                </div>

                <div>

                    <h3 class="font-medium">
                        ${new Date(record.Date).toLocaleDateString("en-IN")}
                    </h3>

                    <p class="text-sm text-gray-500">

                        ${record["Check In"] ? new Date(record["Check In"]).toLocaleTimeString([], {
                            hour: "2-digit",
                            minute: "2-digit"
                        }) : "--:--"}

                        →

                        ${record["Check Out"] ? new Date(record["Check Out"]).toLocaleTimeString([], {
                            hour: "2-digit",
                            minute: "2-digit"
                        }) : "--:--"}

                    </p>

                </div>

            </div>


            <div class="text-right">

                <span class="text-sm text-gray-500">

                    ${data[0]["Total Working Hours"]}

                </span>

            </div>

        </div>
        `;

    });

}
loadAttendance();


</script>
