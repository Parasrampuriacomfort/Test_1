<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if(localStorage.getItem("loggedIn") !== "true") { window.location.replace("index.html"); }
    </script>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Presence - Attendance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="preconnect" href="https://script.google.com"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff", "surface-container-high": "#e8e8e8",
                        "surface-container": "#eeeeee", "surface-container-low": "#f3f3f4",
                        "surface": "#f9f9f9", "error": "#ba1a1a", "secondary": "#5e5e5e",
                        "primary": "#000000", "on-primary": "#ffffff", "on-surface": "#1a1c1c",
                        "outline-variant": "#cfc4c5"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "stack-md": "16px", "margin-mobile": "20px", "gutter": "16px", "stack-lg": "32px", "container-padding": "24px" },
                    "fontFamily": { "headline-sm": ["Hanken Grotesk"], "body-md": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Hanken Grotesk"], "headline-lg-mobile": ["Hanken Grotesk"] }
                }
            }
        }
    </script>
    <style>
        .loader { width: 42px; height: 42px; border: 4px solid #e5e7eb; border-top: 4px solid black; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Hardware Acceleration & Instant Taps */
        button, a { -webkit-tap-highlight-color: transparent; transform: translateZ(0); }
        .interactive-btn { transition: transform 0.1s ease; will-change: transform; }
        .interactive-btn:active:not(:disabled) { transform: scale(0.97); }
    </style>
</head>

<body class="bg-surface text-on-surface font-body-md min-h-screen pb-24 selection:bg-surface-container-highest selection:text-primary">

    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl px-8 py-6 text-center">
            <div class="loader mx-auto mb-4"></div>
            <h2 id="loadingTitle" class="text-lg font-semibold">Processing...</h2>
        </div>
    </div>

    <div id="locationPopup" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-80 text-center">
            <h2 class="text-xl font-bold mb-3">Enable Location</h2>
            <p id="locationPopupText" class="text-gray-600 mb-5">Location is required.</p>
            <button onclick="enableLocation()" class="w-full bg-black text-white py-3 rounded-lg interactive-btn">Enable Location</button>
            <button onclick="closeLocationPopup()" class="mt-3 text-gray-500 interactive-btn">Cancel</button>
        </div>
    </div>

    <header class="w-full top-0 sticky z-40 bg-surface border-b border-surface-container flex items-center justify-between px-margin-mobile h-16 w-full">
        <button class="text-primary hover:opacity-80 p-2 -ml-2 rounded-full interactive-btn">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
        </button>
        <h1 class="text-headline-lg-mobile font-headline-lg-mobile tracking-tight text-primary">Presence</h1>
        <button class="hover:opacity-80 p-1 -mr-1 rounded-full border border-surface-container overflow-hidden w-8 h-8 flex items-center justify-center bg-surface-container-low interactive-btn">
            <img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtcOZCl3_wwHw5sgUG-pSonf2rfjC0XmgfM6YZWrApqE1OsSBnP93eGeSfFGYUEWLX6GkXuRn942XY7ahobSLVNkts8T16HnJX1DmwxN3GDgdBBwqcCkCJ6m1Q7Cr0feTmpYDy_nX9fPDCPaRNqTBjh0XQ9p85uqlspWIzDGqT6JK92Fk7x1OaQ5KGkcFEaIXvkWJNs0hbT7_mzOhgxa3x47lorBaPKSJQuVA14D0ffgrw34tt-SVo6Dp1biFuoFzJluR90fqD7g" id="profileImage">
        </button>
    </header>

    <main class="px-margin-mobile py-stack-lg max-w-2xl mx-auto flex flex-col gap-stack-lg">
        <section class="flex flex-col gap-stack-md">
            <div class="grid grid-cols-2 gap-gutter">
                <button id="checkinButton" class="interactive-btn bg-surface-container-high text-secondary py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 cursor-not-allowed opacity-60 w-full transition-all" disabled>
                    <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">login</span>
                    <span class="font-headline-sm text-headline-sm">Check In</span>
                </button>
                <button id="checkoutButton" class="interactive-btn bg-surface-container-high text-secondary py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 cursor-not-allowed opacity-60 w-full transition-all" disabled>
                    <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">logout</span>
                    <span class="font-headline-sm text-headline-sm">Check Out</span>
                </button>
            </div>
            <div class="text-center">
                <span class="font-body-sm text-body-sm text-secondary">Location Must Be Enable 📍</span>
            </div>
        </section>

        <section class="flex flex-col gap-stack-sm">
            <h2 class="font-headline-md text-headline-md mb-2">Recent Activity</h2>
            <div class="bg-surface-container-lowest rounded-lg border border-surface-container">
                <div id="attendanceList">
                    <div class="p-4 flex flex-col gap-4 animate-pulse">
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                    </div>
                </div>
            </div>
            <button class="mt-2 text-center text-secondary font-label-md text-label-md hover:text-primary py-2 interactive-btn">View all history</button>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-surface border-t border-surface-container z-50">
        <button onclick="window.location.replace('Home.html')" class="interactive-btn flex flex-col items-center justify-center text-primary bg-surface-container-high rounded-full px-6 py-2">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings:'FILL' 1;">fingerprint</span>
            <span class="font-label-md text-label-md">Attendance</span>
        </button>
        <button onclick="window.location.replace('Leave.html')" class="interactive-btn flex flex-col items-center justify-center text-secondary px-6 py-2">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings:'FILL' 0;">event_busy</span>
            <span class="font-label-md text-label-md">Leave</span>
        </button>
    </nav>

    <script>
        // API Connections
        const API_URL_POST = "https://script.google.com/macros/s/AKfycbyke_kVVkFvk-gLHZUKKHaicgJY2sJ0_ppbgq8kv7b1DK7xpTnYjQVF-Q7CD--5oTmk/exec";
        const API_URL_GET = "https://script.google.com/macros/s/AKfycbyJ81-WCQupQpdtmUlrgQdtMbcmgBES6ESVof1fXuqdLwZ1Cr3ghZCaKrFh3ig42hdh/exec";
        
        let pendingAction = "";

        // --- UI BUTTON CONTROLLER ---
        function setButtonStates(canCheckIn, canCheckOut) {
            const cinBtn = document.getElementById("checkinButton");
            const coutBtn = document.getElementById("checkoutButton");
            
            // Solid Black for Active, Gray for Disabled
            const activeClass = "interactive-btn bg-black text-white py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 shadow-lg w-full transition-all";
            const disabledClass = "interactive-btn bg-surface-container-high text-secondary py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 cursor-not-allowed opacity-60 w-full transition-all";

            cinBtn.disabled = !canCheckIn;
            cinBtn.className = canCheckIn ? activeClass : disabledClass;
            
            coutBtn.disabled = !canCheckOut;
            coutBtn.className = canCheckOut ? activeClass : disabledClass;
        }

        // --- GOOGLE SHEETS TIMEZONE FIX ---
        function formatSafeTime(timeValue) {
            if (!timeValue || String(timeValue).trim() === "" || String(timeValue).includes("NaN")) return "--:--";
            let str = String(timeValue).trim();
            
            // Reverse the Google Sheets Pacific Time shift
            if (str.includes("T")) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleTimeString("en-US", { 
                        timeZone: "America/Los_Angeles", 
                        hour: "2-digit", 
                        minute: "2-digit" 
                    }).toLowerCase();
                }
            }
            return str;
        }

        // --- RENDER LIST ---
        function renderList(records) {
            const list = document.getElementById("attendanceList");
            if (!records || records.length === 0) {
                list.innerHTML = '<p class="p-4 text-center text-gray-500">No recent activity</p>';
                return;
            }

            const htmlString = records.map(record => {
                const dateStr = new Date(record.Date).toLocaleDateString("en-IN");
                const checkInStr = formatSafeTime(record["Check In"]);
                const checkOutStr = formatSafeTime(record["Check Out"]);
                let hours = record["Total Working Hours"];
                if (!hours || String(hours).includes("NaN")) hours = "--";

                return `
                <div class="flex items-center justify-between p-4 border-b border-surface-container hover:bg-surface-container-low transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-surface-container rounded flex items-center justify-center text-primary">
                            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">login</span>
                        </div>
                        <div>
                            <h3 class="font-medium">${dateStr}</h3>
                            <p class="text-sm text-gray-500">${checkInStr} → ${checkOutStr}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-sm text-gray-500 font-medium">${hours}</span>
                    </div>
                </div>`;
            }).join('');
            
            list.innerHTML = htmlString;
        }

        // --- LOCATION HANDLING ---
        function showLocationPopup() { document.getElementById("locationPopup").classList.remove("hidden"); }
        function closeLocationPopup() { document.getElementById("locationPopup").classList.add("hidden"); }
        
        async function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject("Geolocation not supported");
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    err => { showLocationPopup(); reject(err); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }
        
        async function getAddress(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                return `${data.address.suburb || ""}, ${data.address.city || data.address.town || ""}, ${data.address.state || ""}`.replace(/^, /, '');
            } catch(e) { return "Location unknown"; }
        }

        // --- SUBMIT DATA (NO RELOAD) ---
        async function submitAttendance(actionType) {
            document.getElementById("loadingTitle").innerText = actionType === 'checkin' ? "Checking In..." : "Checking Out...";
            document.getElementById("loadingOverlay").classList.remove("hidden");

            try {
                const loc = await getLocation();
                const addr = await getAddress(loc.lat, loc.lon);
                
                const now = new Date();
                const dateStr = now.toISOString().split("T")[0];
                const timeStr = now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
                const email = localStorage.getItem("email");
                const recordId = email + "_" + dateStr.replaceAll("-", "");

                const payload = {
                    action: actionType,
                    recordId,
                    employeeName: localStorage.getItem("name"),
                    employeeEmail: email,
                    date: dateStr
                };
                
                if(actionType === 'checkin') {
                    payload.checkIn = timeStr;
                    payload.checkInLocation = addr;
                } else {
                    payload.checkOut = timeStr;
                    payload.checkOutLocation = addr;
                }

                await fetch(API_URL_POST, { method: "POST", body: JSON.stringify(payload) });
                
                // Fetch fresh data dynamically to update the list without a full page reload
                await loadAttendance();

            } catch (err) {
                console.error(err);
                // Revert buttons if it failed
                if (actionType === 'checkin') setButtonStates(true, false);
                if (actionType === 'checkout') setButtonStates(false, true);
            } finally {
                document.getElementById("loadingOverlay").classList.add("hidden");
            }
        }

        // --- BUTTON EVENT LISTENERS (Instant Visual Feedback) ---
        document.getElementById("checkinButton").addEventListener("click", () => {
            setButtonStates(false, true); // Instantly turn Check-In Gray, Check-Out Black
            submitAttendance("checkin");
        });

        document.getElementById("checkoutButton").addEventListener("click", () => {
            setButtonStates(false, false); // Instantly turn both Gray
            submitAttendance("checkout");
        });

        async function enableLocation() {
            closeLocationPopup();
            if(pendingAction) submitAttendance(pendingAction);
        }

        // --- INITIAL LOAD ---
        async function loadAttendance() {
            const email = localStorage.getItem("email");
            try {
                const profileImg = localStorage.getItem("photo");
                if(profileImg) document.getElementById("profileImage").src = profileImg;
            } catch(e) {}

            try {
                const response = await fetch(API_URL_GET + "?email=" + encodeURIComponent(email));
                const data = await response.json();
                
                const myAttendance = data.filter(r => r["Employee Email"] === email).reverse();
                renderList(myAttendance);
                
                // Day Reset Logic (Checks if today has records)
                let canCheckIn = true;
                let canCheckOut = false;

                if (myAttendance.length > 0) {
                    const latestRecord = myAttendance[0];
                    const todayStr = new Date().toLocaleDateString("en-IN");
                    const recordDateStr = new Date(latestRecord.Date).toLocaleDateString("en-IN");

                    if (todayStr === recordDateStr) {
                        if (latestRecord["Check In"] && !latestRecord["Check Out"]) {
                            canCheckIn = false;
                            canCheckOut = true; // Waiting to check out
                        } else if (latestRecord["Check In"] && latestRecord["Check Out"]) {
                            canCheckIn = false;
                            canCheckOut = false; // Finished day, disabled until tomorrow
                        }
                    }
                }
                setButtonStates(canCheckIn, canCheckOut);

            } catch (err) {
                console.error("Failed to load data", err);
                document.getElementById("attendanceList").innerHTML = '<p class="p-4 text-center text-error">Failed to load data.</p>';
            }
        }
        
        loadAttendance();
    </script>
</body>
</html>
