<!DOCTYPE html>
<html lang="en">
<head>

    <script >if(localStorage.getItem("loggedIn") !== "true"){

    window.location.href="Login Screen.html";

}</script>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Presence - Attendance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="preconnect" href="https://script.google.com"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff", "surface-container-high": "#e8e8e8",
                        "surface-container": "#eeeeee", "surface-container-low": "#f3f3f4",
                        "surface": "#f9f9f9", "error": "#ba1a1a", "secondary": "#5e5e5e",
                        "primary": "#000000", "on-primary": "#ffffff", "on-surface": "#1a1c1c",
                        "outline-variant": "#cfc4c5"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "stack-md": "16px", "margin-mobile": "20px", "gutter": "16px", "stack-lg": "32px", "container-padding": "24px" },
                    "fontFamily": { "headline-sm": ["Hanken Grotesk"], "body-md": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Hanken Grotesk"], "headline-lg-mobile": ["Hanken Grotesk"] }
                }
            }
        }
    </script>
    <style>
        .loader { width: 42px; height: 42px; border: 4px solid #e5e7eb; border-top: 4px solid black; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Hardware Acceleration & Instant Taps */
        button, a { -webkit-tap-highlight-color: transparent; transform: translateZ(0); }
        .interactive-btn { transition: transform 0.1s ease; will-change: transform; }
        .interactive-btn:active:not(:disabled) { transform: scale(0.97); }
    </style>
</head>

<body class="bg-surface text-on-surface font-body-md min-h-screen pb-24 selection:bg-surface-container-highest selection:text-primary">

    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl px-8 py-6 text-center">
            <div class="loader mx-auto mb-4"></div>
            <h2 id="loadingTitle" class="text-lg font-semibold">Processing...</h2>
        </div>
    </div>

    <div id="locationPopup" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-80 text-center">
            <h2 class="text-xl font-bold mb-3">Enable Location</h2>
            <p id="locationPopupText" class="text-gray-600 mb-5">Location is required.</p>
            <button onclick="enableLocation()" class="w-full bg-black text-white py-3 rounded-lg interactive-btn">Enable Location</button>
            <button onclick="closeLocationPopup()" class="mt-3 text-gray-500 interactive-btn w-full py-2">Cancel</button>
        </div>
    </div>

    <header class="top-0 sticky z-40 bg-surface border-b border-surface-container flex items-center justify-between px-margin-mobile h-16 w-full">
        <button class="text-primary hover:opacity-80 p-2 -ml-2 rounded-full interactive-btn">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
        </button>
        <h1 class="text-headline-lg-mobile font-headline-lg-mobile tracking-tight text-primary">Presence</h1>
        <button class="hover:opacity-80 p-1 -mr-1 rounded-full border border-surface-container overflow-hidden w-8 h-8 flex items-center justify-center bg-surface-container-low interactive-btn">
            <img alt="Profile" class="w-full h-full object-cover" src="https://ui-avatars.com/api/?name=User&background=random" id="profileImage">
        </button>
    </header>

    <main class="px-margin-mobile py-stack-lg max-w-2xl mx-auto flex flex-col gap-stack-lg">
        <section class="flex flex-col gap-stack-md">
            <div class="grid grid-cols-2 gap-gutter">
                <button id="checkinButton" class="interactive-btn bg-surface-container-high text-secondary py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 cursor-not-allowed opacity-60 w-full transition-all" disabled>
                    <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">login</span>
                    <span class="font-headline-sm text-headline-sm">Check In</span>
                </button>
                <button id="checkoutButton" class="interactive-btn bg-surface-container-high text-secondary py-4 px-6 rounded-lg flex flex-col items-center justify-center gap-2 h-32 cursor-not-allowed opacity-60 w-full transition-all" disabled>
                    <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">logout</span>
                    <span class="font-headline-sm text-headline-sm">Check Out</span>
                </button>
            </div>
            <div class="text-center">
                <span class="font-body-sm text-body-sm text-secondary">Location Must Be Enabled 📍</span>
            </div>
        </section>

        <section class="flex flex-col gap-stack-sm">
            <h2 class="font-headline-md text-headline-md mb-2">Recent Activity</h2>
            <div class="bg-surface-container-lowest rounded-lg border border-surface-container">
                <div id="attendanceList">
                    <div class="p-4 flex flex-col gap-4 animate-pulse">
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                        <div class="h-16 bg-surface-container rounded-lg w-full"></div>
                    </div>
                </div>
            </div>
            <button class="mt-2 text-center text-secondary font-label-md text-label-md hover:text-primary py-2 interactive-btn w-full">View all history</button>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-surface dark:bg-surface-container-low border-t border-surface-container shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)] z-50 md:hidden">
        <button
            onclick="window.location.href='Home.html'"
            class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed bg-secondary-container dark:bg-tertiary-container rounded-full px-6 py-2 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-all duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings:'FILL' 1;">fingerprint</span>
            <span class="font-label-md text-label-md">Attendance</span>
        </button>

        <button
            onclick="window.location.href='Leave.html'"
            class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant px-6 py-2 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-all duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings:'FILL' 0;">event_busy</span>
            <span class="font-label-md text-label-md">Leave</span>
        </button>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const checkinBtn = document.getElementById('checkinButton');
            const checkoutBtn = document.getElementById('checkoutButton');
            const attendanceList = document.getElementById('attendanceList');
            const locationPopup = document.getElementById('locationPopup');

            // Simulate the attendance.js loading process (1.5 seconds)
            setTimeout(() => {
                // Enable buttons and remove disabled styling
                checkinBtn.disabled = false;
                checkinBtn.classList.remove('cursor-not-allowed', 'opacity-60');
                
                checkoutBtn.disabled = false;
                checkoutBtn.classList.remove('cursor-not-allowed', 'opacity-60');

                // Remove the skeleton loader and replace with mock data
                attendanceList.innerHTML = `
                    <div class="p-4 border-b border-surface-container flex justify-between items-center">
                        <div>
                            <p class="font-semibold text-primary">Checked In</p>
                            <p class="text-sm text-secondary">Today, 09:00 AM</p>
                        </div>
                        <span class="material-symbols-outlined text-green-600">check_circle</span>
                    </div>
                    <div class="p-4 flex justify-between items-center">
                        <div>
                            <p class="font-semibold text-primary">Checked Out</p>
                            <p class="text-sm text-secondary">Yesterday, 06:15 PM</p>
                        </div>
                        <span class="material-symbols-outlined text-gray-400">check_circle</span>
                    </div>
                `;
            }, 1500);

            // Bind click events to show the popup for testing
            checkinBtn.addEventListener('click', () => {
                locationPopup.classList.remove('hidden');
            });

            checkoutBtn.addEventListener('click', () => {
                locationPopup.classList.remove('hidden');
            });
        });

        // Global functions for the location popup so HTML onclick handlers work
        function enableLocation() {
            document.getElementById('locationPopup').classList.add('hidden');
            // This is where you would hook up the actual browser geolocation API
            alert("Location access requested!"); 
        }

        function closeLocationPopup() {
            document.getElementById('locationPopup').classList.add('hidden');
        }
    </script>
</body>
</html>
